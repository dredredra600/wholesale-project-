<title>Pure Sport Command</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
/* Layout concept: one dark, full-bleed "galaxy" home (agents as constellations around a black hole); every other page is a quiet panel on the same void. */
:root {
  --void: #05060a; --panel: #0c0e15; --panel-2: #121521; --ink: #eceff6; --dim: #8b92a6; --faint: #5b6174;
  --line: rgba(255,255,255,.11); --glow: #ffb561; --glow-soft: rgba(255,181,97,.14);
  --ok: #7fd6a4; --warn: #ffb561; --bad: #ff7d7d; --info: #8fb4ff;
  --display: "Space Grotesk", "Helvetica Neue", Arial, sans-serif; --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--void); color: var(--ink); }
body { font: 14px/1.5 var(--body); margin: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-height: 100%; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--void); z-index: 40; }
h1, h2, h3 { font-family: var(--display); font-weight: 500; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--glow); }
:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.mono { font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-block: 12px; background: linear-gradient(var(--void) 60%, transparent); }
.brand { font-family: var(--display); font-size: 13px; line-height: 1.25; min-width: 0; }
.brand b { display: block; font-weight: 600; }
.brand span { color: var(--dim); font-size: 11px; }
.pill { border: 1px solid var(--line); background: rgba(255,255,255,.04); border-radius: 999px; padding: 7px 16px; font-size: 12px; color: var(--ink); backdrop-filter: blur(6px); }
.pill:hover { border-color: rgba(255,255,255,.3); }
.pill.on { border-color: var(--glow); }
.top .right { justify-self: end; }
.badge { display: inline-block; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--dim); white-space: nowrap; }
.badge.sample { color: var(--info); border-color: rgba(143,180,255,.4); }
.badge.warn { color: var(--warn); border-color: rgba(255,181,97,.45); }
.badge.ok { color: var(--ok); border-color: rgba(127,214,164,.45); }
.badge.bad { color: var(--bad); border-color: rgba(255,125,125,.45); }

/* galaxy home */
.home { position: relative; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); display: grid; grid-template-columns: minmax(250px, 320px) 1fr; min-height: calc(100vh - 70px); }
.stage { position: relative; grid-column: 1 / -1; grid-row: 1; min-height: 520px; overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.panel-home { position: relative; grid-column: 1; grid-row: 1; z-index: 2; padding: 20px max(16px, env(safe-area-inset-left, 0px)) 20px 24px; align-self: start; max-width: 330px; }
.panel-home h1 { font-size: 26px; line-height: 1.15; font-weight: 500; }
.panel-home .sub { color: var(--faint); font-size: 11px; margin-top: 6px; }
.panel-home .lead-line { margin: 18px 0 20px; font-size: 13px; }
.eyebrow { text-transform: uppercase; letter-spacing: .12em; font-size: 10px; color: var(--dim); margin-bottom: 8px; }
.up { list-style: none; padding: 0; margin: 0 0 20px; display: grid; gap: 2px; }
.up li a { display: grid; grid-template-columns: 34px 1fr; gap: 8px; padding: 5px 0; color: var(--ink); text-decoration: none; font-size: 12.5px; }
.up li a:hover span:last-child { color: var(--glow); }
.up .n { color: var(--glow); font-variant-numeric: tabular-nums; text-align: right; }
.up .n.zero { color: var(--faint); }
.q-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; font-size: 12px; color: var(--dim); }
.q-list a { color: var(--dim); text-decoration: none; }
.q-list a:hover { color: var(--glow); }
.label { position: absolute; z-index: 3; transform: translate(-50%, -50%); background: none; border: 0; text-align: center; color: var(--ink); padding: 6px 10px; border-radius: 8px; }
.label b { display: block; font: 600 12px var(--display); text-shadow: 0 0 8px #000, 0 0 16px #000; }
.label small { display: block; color: var(--dim); font-size: 10px; margin-top: 1px; text-shadow: 0 0 6px #000; }
.label:hover b { color: var(--glow); }
.dock { position: absolute; z-index: 4; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: rgba(12,14,21,.7); backdrop-filter: blur(8px); }
.dock button { width: 34px; height: 30px; border: 0; background: none; border-radius: 8px; color: var(--dim); font-size: 15px; }
.dock button:hover { color: var(--ink); background: rgba(255,255,255,.06); }

/* pages */
.page { max-width: 1040px; margin: 0 auto; padding-block: 8px 80px; display: grid; gap: 22px; }
.page-head { display: grid; gap: 6px; }
.page-head h1 { font-size: 28px; }
.page-head p { color: var(--dim); margin: 0; max-width: 62ch; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 8px; font-size: 12px; color: var(--dim); }
.stats b { color: var(--ink); font-size: 18px; font-family: var(--display); font-weight: 500; margin-right: 4px; font-variant-numeric: tabular-nums; }
.sec { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 12px; }
.sec > h2 { font-size: 15px; display: flex; align-items: center; gap: 10px; }
.sec > h2 small { font: 11px var(--body); color: var(--dim); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row.between { justify-content: space-between; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.empty { color: var(--dim); border: 1px dashed var(--line); border-radius: 10px; padding: 18px; font-size: 13px; }
.muted { color: var(--dim); font-size: 12px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 7px 12px; font-size: 12.5px; }
.btn:hover { border-color: rgba(255,255,255,.35); }
.btn.go { background: var(--glow); color: #1b1206; border-color: var(--glow); font-weight: 600; }
.btn.go:hover { filter: brightness(1.08); }
.btn.ghost { background: none; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.fld { display: grid; gap: 4px; font-size: 12px; color: var(--dim); min-width: 0; }
.fld input, .fld select, .fld textarea { background: #090b11; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; color: var(--ink); width: 100%; min-width: 0; }
.fld textarea { resize: vertical; min-height: 84px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--dim); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }
tr.click { cursor: pointer; }
tr.click:hover td { background: rgba(255,255,255,.03); }
tr:last-child td { border-bottom: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 4px 11px; font-size: 12px; color: var(--dim); }
.chip.on { color: var(--ink); border-color: var(--glow); }
.item { display: grid; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item .t { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.item .t b { font-weight: 600; }
.copybox { background: #090b11; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
.tl li { display: grid; grid-template-columns: 12px 1fr; gap: 10px; padding-bottom: 12px; position: relative; }
.tl li::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--glow); margin-top: 6px; justify-self: center; z-index: 1; }
.tl li::after { content: ""; position: absolute; left: 5.5px; top: 14px; bottom: 0; width: 1px; background: var(--line); }
.tl li:last-child::after { display: none; }
.tl .who { font-size: 11px; color: var(--dim); }
.drawer-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 50; display: flex; justify-content: flex-end; }
.drawer { width: min(520px, 100%); height: 100%; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 20px max(16px, env(safe-area-inset-right, 0px)) 60px 20px; padding-top: calc(20px + env(safe-area-inset-top, 0px)); display: grid; gap: 16px; align-content: start; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 16px; font-size: 12.5px; max-width: calc(100% - 32px); }
.menu { position: fixed; inset: 0; z-index: 60; background: rgba(5,6,10,.92); display: grid; place-items: center; padding: 20px; }
.menu nav { display: grid; gap: 4px; width: min(380px, 100%); }
.menu a { display: flex; justify-content: space-between; padding: 12px 4px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none; font: 500 18px var(--display); }
.menu a small { font: 11px var(--body); color: var(--dim); align-self: center; }
.menu a:hover { color: var(--glow); }
.chat { display: grid; gap: 12px; }
.msgs { display: grid; gap: 10px; max-height: 56vh; overflow-y: auto; padding-right: 4px; }
.msg { max-width: 84ch; padding: 10px 14px; border-radius: 10px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
.msg.user { background: var(--glow-soft); border: 1px solid rgba(255,181,97,.25); justify-self: end; }
.msg.bot { background: var(--panel-2); border: 1px solid var(--line); }
.check { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: start; font-size: 13px; }
.check i { width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--faint); margin-top: 3px; }
.check.done i { background: var(--ok); border-color: var(--ok); }
details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; background: var(--panel); }
details summary { cursor: pointer; font-weight: 500; }
details ol { margin: 10px 0 2px; padding-left: 20px; display: grid; gap: 6px; color: var(--dim); }
details code, .page code { background: #090b11; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 12px; color: var(--ink); overflow-wrap: anywhere; }
@media (max-width: 760px) {
  .home { grid-template-columns: 1fr; min-height: 0; }
  .stage { grid-row: 1; min-height: 62vh; }
  .panel-home { grid-row: 2; max-width: none; padding: 18px 16px 40px; }
  .top { grid-template-columns: auto 1fr auto; }
  .brand span { display: none; }
  .page-head h1 { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

</style>
<header class="top">
  <div class="brand"><b>Pure Sport Detailing</b><span>Command <span id="sampleflag" class="badge sample" hidden>Sample data loaded</span></span></div>
  <button class="pill on" data-nav="home" onclick="location.hash='home'">Home</button>
  <div class="right"><button class="pill" data-menu aria-haspopup="dialog">Pages</button></div>
</header>
<main id="view"></main>
<script>
/* Pure Sport Detailing: shared lead logic. No DOM, no network. Runs in the page and in Node tests. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.PSD = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  const AGENTS = [
    { id: 'intake', name: 'Lead Intake', blurb: 'Captures inquiries, records PRICE or BOOK as the source, flags missing vehicle or service details.' },
    { id: 'quote', name: 'Quote Assistant', blurb: 'Drafts quotes from your pricing rules and the reply from your template. You approve every quote.' },
    { id: 'booking', name: 'Booking', blurb: 'Prepares the booking link or flags a custom slot. Marks a job booked only after you confirm.' },
    { id: 'followup', name: 'Follow-Up', blurb: 'Tracks open quotes and finished jobs. Drafts follow-ups and review requests.' },
    { id: 'content', name: 'Content', blurb: 'Turns footage notes into Reel hooks, captions and PRICE or BOOK calls to action.' },
  ];

  const STAGES = {
    new: 'New', needs_info: 'Needs info', ready_to_quote: 'Ready to quote', awaiting_approval: 'Quote to approve',
    approved: 'Quote approved', booking_handoff: 'Booking handoff', booked: 'Booked', followup: 'Follow-up', closed: 'Closed',
  };

  const KEYWORDS = ['PRICE', 'BOOK'];
  const VEHICLE_CLASSES = ['sedan', 'suv', 'truck'];

  const DEFAULT_TEMPLATES = {
    PRICE: 'Hey {{first_name}}, thanks for asking about pricing! For your {{vehicle}}, the {{service}} is {{quote}}. If you want a time on the schedule, reply BOOK. Pure Sport Detailing',
    BOOK: 'Hey {{first_name}}, let\'s get your {{vehicle}} on the schedule. Pick a time here: {{booking_link}}. Pure Sport Detailing',
    FOLLOWUP: 'Hey {{first_name}}, checking in on the {{service}} quote for your {{vehicle}}. Want me to hold a spot this week? Pure Sport Detailing',
    REVIEW: 'Hey {{first_name}}, thanks for trusting us with your {{vehicle}}. If you\'re happy with the result, a quick review helps a lot: {{review_link}}. Pure Sport Detailing',
  };

  const DEFAULT_CONFIG = {
    business: { name: 'Pure Sport Detailing', area: '', hours: '' },
    instagram: { handle: '', testReel: '' },
    links: { booking: '', form: '', sheet: '', review: '' },
    pricing: [], // [{service, sedan, suv, truck}] dollars; blank = not priced
    templates: DEFAULT_TEMPLATES,
    publishing: 'off', // 'off' | 'buffer'
    followupDays: 3,
    connections: { manychat: false, sheets: false, calendar: false, buffer: false },
    templatesAreSample: true,
  };

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const nowIso = () => new Date().toISOString();
  const norm = (s) => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]+/g, '');
  const clean = (s) => String(s == null ? '' : s).trim();

  /* ---------- platform adapters (add new platforms here) ---------- */
  const ALIASES = {
    handle: ['igusername', 'instagramhandle', 'handle', 'username', 'instagram'],
    keyword: ['keyword', 'trigger', 'source'],
    eventId: ['eventid', 'commentid', 'id'],
    postId: ['reel', 'postid', 'post', 'reelurl'],
    timestamp: ['timestamp', 'time', 'submittedat'],
    name: ['name', 'fullname', 'firstname'],
    vehicle: ['vehicle', 'vehicleyearmakemodel', 'car'],
    vehicleClass: ['vehiclesize', 'size', 'vehicleclass'],
    service: ['servicewanted', 'service'],
    photos: ['photoslink', 'photos', 'photolinks'],
    notes: ['notes', 'message', 'comments'],
  };
  function pick(raw, key) {
    const map = {};
    Object.keys(raw || {}).forEach((k) => { map[norm(k)] = raw[k]; });
    for (const a of ALIASES[key]) if (clean(map[a])) return clean(map[a]);
    return '';
  }
  function guessClass(sizeText, vehicleText) {
    const t = (sizeText + ' ' + vehicleText).toLowerCase();
    if (/truck|pickup|f-?150|silverado|ram|tacoma/.test(t)) return 'truck';
    if (/suv|crossover|tahoe|suburban|explorer|rav4|cr-?v/.test(t)) return 'suv';
    if (/sedan|coupe|hatch|civic|accord|mustang|camaro|miata/.test(t)) return 'sedan';
    return '';
  }
  const adapters = {
    instagram: {
      label: 'Instagram (ManyChat + Google Form)',
      normalize(raw) {
        const handle = pick(raw, 'handle').replace(/^@/, '');
        const keyword = pick(raw, 'keyword').toUpperCase();
        if (!handle) return { ok: false, reason: 'No Instagram handle on this row.' };
        if (!KEYWORDS.includes(keyword)) return { ok: false, reason: 'Keyword "' + keyword + '" is not PRICE or BOOK.' };
        const timestamp = pick(raw, 'timestamp');
        const given = pick(raw, 'eventId');
        const vehicle = pick(raw, 'vehicle');
        const sizeText = pick(raw, 'vehicleClass');
        return {
          ok: true,
          evt: {
            platform: 'instagram', handle, keyword,
            eventId: given || (timestamp ? timestamp + '|' + handle.toLowerCase() + '|' + keyword : ''),
            postId: pick(raw, 'postId'), name: pick(raw, 'name'), vehicle,
            vehicleClass: VEHICLE_CLASSES.includes(sizeText.toLowerCase()) ? sizeText.toLowerCase() : guessClass(sizeText, vehicle),
            service: pick(raw, 'service'), photos: pick(raw, 'photos'), notes: pick(raw, 'notes'),
          },
        };
      },
    },
  };
  function registerAdapter(platform, adapter) { adapters[platform] = adapter; }

  /* ---------- leads ---------- */
  function leadId(platform, handle, keyword) {
    return (platform + '_' + handle.toLowerCase() + '_' + keyword.toLowerCase()).replace(/[^a-z0-9_]+/g, '-');
  }
  function addHistory(lead, agent, action, detail, now) {
    lead.history.push({ at: now, agent, action, detail: detail || '' });
  }
  function setStage(lead, stage, now) { lead.stage = stage; lead.stageAt = now; }
  function missingDetails(lead) {
    const m = [];
    if (!clean(lead.vehicle)) m.push('vehicle');
    if (!clean(lead.service)) m.push('service');
    return m;
  }
  function triage(lead, now) {
    if (['new', 'needs_info', 'ready_to_quote'].indexOf(lead.stage) === -1) return;
    const miss = missingDetails(lead);
    const next = miss.length ? 'needs_info' : 'ready_to_quote';
    if (next !== lead.stage) setStage(lead, next, now);
  }

  function ingest(leads, evt, now, opts) {
    now = now || nowIso(); opts = opts || {};
    let id = leadId(evt.platform, evt.handle, evt.keyword);
    if (leads[id] && leads[id].stage === 'closed') id = id + '-' + now.slice(0, 10).replace(/-/g, '');
    const out = Object.assign({}, leads);
    const existing = out[id];
    if (existing) {
      if (evt.eventId && (existing.seenEvents || []).indexOf(evt.eventId) !== -1) {
        return { leads: out, lead: existing, created: false, duplicate: true, merged: false };
      }
      const lead = clone(existing);
      lead.seenEvents = (lead.seenEvents || []).concat(evt.eventId ? [evt.eventId] : []);
      lead.repeatCount = (lead.repeatCount || 0) + 1;
      const filled = [];
      ['name', 'vehicle', 'vehicleClass', 'service', 'photos', 'notes', 'postId'].forEach((k) => {
        if (!clean(lead[k]) && clean(evt[k])) { lead[k] = evt[k]; filled.push(k); }
      });
      addHistory(lead, 'Lead Intake', 'Repeat event merged', filled.length ? 'Filled in: ' + filled.join(', ') : 'No new details.', now);
      triage(lead, now);
      out[id] = lead;
      return { leads: out, lead, created: false, duplicate: false, merged: true };
    }
    const lead = {
      id, platform: evt.platform, handle: evt.handle, keyword: evt.keyword, source: evt.keyword,
      postId: evt.postId || '', name: evt.name || '', vehicle: evt.vehicle || '', vehicleClass: evt.vehicleClass || '',
      service: evt.service || '', photos: evt.photos || '', notes: evt.notes || '',
      stage: 'new', stageAt: now, createdAt: now, isNew: true, sample: !!opts.sample,
      repeatCount: 0, seenEvents: evt.eventId ? [evt.eventId] : [], history: [],
      quote: null, reply: null, booking: null,
    };
    addHistory(lead, 'Lead Intake', 'Inquiry captured', evt.platform + ' comment keyword ' + evt.keyword + (evt.postId ? ' on ' + evt.postId : ''), now);
    triage(lead, now);
    const miss = missingDetails(lead);
    if (miss.length) addHistory(lead, 'Lead Intake', 'Flagged missing details', miss.join(', '), now);
    out[id] = lead;
    return { leads: out, lead, created: true, duplicate: false, merged: false };
  }

  function importRows(leads, platform, rows, now, opts) {
    const adapter = adapters[platform];
    const res = { leads, created: 0, merged: 0, duplicates: 0, ignored: [] };
    if (!adapter) { res.ignored.push({ reason: 'No adapter for ' + platform }); return res; }
    rows.forEach((row, i) => {
      const n = adapter.normalize(row);
      if (!n.ok) { res.ignored.push({ row: i + 1, reason: n.reason }); return; }
      const r = ingest(res.leads, n.evt, now, opts);
      res.leads = r.leads;
      if (r.created) res.created++; else if (r.duplicate) res.duplicates++; else if (r.merged) res.merged++;
    });
    return res;
  }

  function updateDetails(lead, patch, now) {
    now = now || nowIso();
    const l = clone(lead); const changed = [];
    ['name', 'vehicle', 'vehicleClass', 'service', 'photos', 'notes'].forEach((k) => {
      if (patch[k] !== undefined && clean(patch[k]) !== clean(l[k])) { l[k] = clean(patch[k]); changed.push(k); }
    });
    if (changed.length) { addHistory(l, 'Owner', 'Details updated', changed.join(', '), now); triage(l, now); }
    return l;
  }

  /* ---------- quote assistant ---------- */
  function priceQuote(lead, config) {
    const rules = (config.pricing || []).filter((r) => clean(r.service));
    if (!rules.length) return { status: 'needs_review', reason: 'No pricing rules saved yet. Add them in Setup.' };
    const s = clean(lead.service).toLowerCase();
    const rule = rules.find((r) => r.service.toLowerCase() === s) || rules.find((r) => s.indexOf(r.service.toLowerCase()) !== -1 || r.service.toLowerCase().indexOf(s) !== -1);
    if (!rule) return { status: 'needs_review', reason: 'No pricing rule matches "' + lead.service + '".' };
    if (!lead.vehicleClass) return { status: 'needs_review', reason: 'Vehicle size (sedan, SUV or truck) is not set, so the price is ambiguous.' };
    const price = Number(rule[lead.vehicleClass]);
    if (!isFinite(price) || price <= 0 || rule[lead.vehicleClass] === '' || rule[lead.vehicleClass] == null) {
      return { status: 'needs_review', reason: 'No ' + lead.vehicleClass + ' price saved for "' + rule.service + '".' };
    }
    return { status: 'drafted', amount: price, service: rule.service };
  }

  function fill(template, vars) {
    const missing = [];
    const text = String(template || '').replace(/\{\{(\w+)\}\}/g, (m, k) => {

        check(c.pricing.some((r) => r.service && (r.sedan || r.suv || r.truck)), 'Pricing rules by service and vehicle size'), check(!c.templatesAreSample, 'Your PRICE and BOOK reply wording'),
        check(!!c.links.booking, 'Approved booking link'), check(!!c.links.form, 'Google Form link for intake'), check(!!c.instagram.handle, 'Instagram handle'), check(!!c.instagram.testReel, 'Test Reel for the first ManyChat flow'), check(!!c.links.review, 'Google review link')].join('') + '</div></div>' +
      '<form id="setupform" class="sec" autocomplete="off"><h2>Business and Instagram</h2><div class="card"><div class="grid2">' + f('b-name', 'Business name', c.business.name) + f('b-area', 'Service area', c.business.area, 'City, neighborhoods, mobile or shop') + f('b-hours', 'Hours', c.business.hours, 'Mon to Sat, 8 to 5') + f('i-handle', 'Instagram handle', c.instagram.handle, '@puresportdetailing') + f('i-reel', 'Test Reel link', c.instagram.testReel, 'https://www.instagram.com/reel/...') + '</div></div>' +
      '<h2>Links</h2><div class="card"><div class="grid2">' + f('l-book', 'Approved booking link', c.links.booking, 'Google Calendar appointment page or other') + f('l-form', 'Google Form (intake) link', c.links.form, 'https://forms.gle/...') + f('l-sheet', 'Google Sheet link', c.links.sheet, 'https://docs.google.com/spreadsheets/...') + f('l-review', 'Google review link', c.links.review, 'https://g.page/r/...') + '</div></div>' +
      '<h2>Pricing rules</h2><div class="card" id="pricing">' + pricingRows() + '<div class="row"><button type="button" class="btn" data-act="addprice">Add a service</button></div><div class="muted">Leave a size blank if you do not price it. Those jobs go to you.</div></div>' +
      '<h2>Reply templates</h2><div class="card">' + (c.templatesAreSample ? '<div><span class="badge sample">Sample</span> <span class="muted">These are placeholders. Replace them with your wording.</span></div>' : '') + tpl('PRICE', 'PRICE reply') + tpl('BOOK', 'BOOK reply') + tpl('FOLLOWUP', 'Quote follow-up') + tpl('REVIEW', 'Review request') + '<div class="muted">Placeholders: <code>{{first_name}}</code> <code>{{vehicle}}</code> <code>{{service}}</code> <code>{{quote}}</code> <code>{{booking_link}}</code> <code>{{review_link}}</code>. A placeholder with no value shows as a NEEDED marker so nothing goes out half-filled.</div></div>' +
      '<h2>Rules</h2><div class="card"><div class="grid2">' + f('f-days', 'Follow up on open quotes after (days)', c.followupDays, '', 'number') + '</div><div class="muted">All agents draft only. You send every message and approve every quote, booking and post.</div></div>' +
      '<div class="row"><button type="submit" class="btn go">Save setup</button></div></form>' +
      '<div class="sec"><h2>Connections</h2><div class="card">' + [['manychat', 'ManyChat linked to your Instagram professional account'], ['sheets', 'Google Form and Sheet created'], ['calendar', 'Google Calendar appointment page'], ['buffer', 'Buffer (optional, publishing stays off)']].map(([k, t]) => '<label class="check ' + (c.connections[k] ? 'done' : '') + '" style="cursor:pointer"><input type="checkbox" data-conn="' + k + '" ' + (c.connections[k] ? 'checked' : '') + ' style="margin-top:3px"><span>' + t + '</span></label>').join('') + '<div class="muted">These are your own checklist. Nothing connects until you authorize it.</div></div>' + guides() + '</div>';
  }
  function guides() {
    return '<details><summary>ManyChat: comment-to-DM flow for PRICE and BOOK</summary><ol>' +
      '<li>In ManyChat, connect your Instagram professional account: Settings, Instagram, Connect.</li>' +
      '<li>Automation, New Automation, trigger: <b>Instagram Comments</b>, pick your <b>test Reel</b> only.</li>' +
      '<li>Keywords: add <code>PRICE</code> and <code>BOOK</code> as two separate conditions (contains, not case sensitive).</li>' +
      '<li>For each keyword, the action is a DM with your approved wording and a button that opens your Google Form link with the prefilled address from the next section.</li>' +
      '<li>Leave the flow in <b>Draft</b>. Turn it on only after you tell me you are ready for live messages.</li></ol></details>' +
      '<details><summary>Google Form and Sheet: keep source and keyword on every lead</summary><ol>' +
      '<li>Create a Form named Pure Sport Intake. Add these questions with exactly these titles: <code>Instagram handle</code>, <code>Keyword</code>, <code>Reel</code>, <code>Name</code>, <code>Vehicle (year make model)</code>, <code>Vehicle size</code> (Sedan, SUV, Truck), <code>Service wanted</code>, <code>Photos link</code>, <code>Notes</code>.</li>' +
      '<li>Responses tab, Link to Sheets, create the Sheet. The <code>Timestamp</code> column is added for you.</li>' +
      '<li>Form menu (three dots), Get pre-filled link. Type <code>PRICE</code> in Keyword, <code>TEST-REEL</code> in Reel, and a placeholder handle. Click Get link, copy it.</li>' +
      '<li>In the link, swap the placeholder values for ManyChat fields: the Keyword value becomes the trigger keyword for that flow (PRICE in the PRICE flow, BOOK in the BOOK flow), and the handle value becomes <code>{{ig_username}}</code>. Use one link per keyword, so the keyword is set by the flow, not typed by the customer.</li>' +
      '<li>In the Sheet, select the header and data rows, copy, and paste into Lead Intake. Re-pasting is safe.</li></ol></details>';
  }

  /* ---------- chat ---------- */
  const SYSTEM = 'You are the assistant inside the Pure Sport Detailing dashboard, a private tool for the owner of a car detailing business. Be brief and practical. You can read dashboard data with the tools provided but you cannot change it or message customers. Never invent prices, availability or customer facts: if the data is missing, say what is missing. Agents only draft; the owner sends and approves everything.';
  function pgChat() {
    return head('chat', 'Chat', 'Ask about your leads, draft reply wording, or plan content. Claude can read the dashboard but cannot change it or message anyone.') +
      (sample ? '<div class="chat"><div class="msgs" id="msgs" aria-live="polite"></div><div class="chips">' + ['What needs my attention?', 'Draft a PRICE reply template for me to edit', 'Write 3 Reel hooks for a ceramic coating job', 'Which leads are missing details?'].map((s) => '<button class="chip" data-act="suggest" data-v="' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div><form id="chatform" class="row" style="flex-wrap:nowrap"><div class="fld" style="flex:1"><label class="sr" for="chatin" style="position:absolute;left:-9999px">Message</label><input id="chatin" placeholder="Ask anything about your business or leads" autocomplete="off"></div><button class="btn go" type="submit">Send</button></form></div>' : '<div class="empty">Chat needs Claude access in this view. Open the dashboard from claude.ai while signed in to use it.</div>');
  }
  function renderMsgs() {
    const box = $('#msgs'); if (!box) return;
    box.innerHTML = S.chat.length ? S.chat.map((m, i) => '<div class="msg ' + (m.role === 'user' ? 'user' : 'bot') + '">' + esc(m.content || '…') + (m.role === 'assistant' && m.content ? '<div class="row" style="margin-top:8px"><button class="btn ghost" data-act="usetpl" data-k="PRICE" data-i="' + i + '">Use as PRICE template</button><button class="btn ghost" data-act="usetpl" data-k="BOOK" data-i="' + i + '">Use as BOOK template</button></div>' : '') + '</div>').join('') : '<div class="empty">Ask a question or pick a suggestion below. When Claude drafts reply wording, you can put it into your template with one click.</div>';
    box.scrollTop = box.scrollHeight;
  }
  function chatMounted() { renderMsgs(); }
  let chatCtl = null;
  async function sendChat(text) {
    if (!sample || !text.trim() || S.busy) return;
    S.chat.push({ role: 'user', content: text.trim() }); const bot = { role: 'assistant', content: '' }; S.chat.push(bot); S.busy = true; renderMsgs();
    const msgs = S.chat.slice(0, -1).slice(-14).map((m, i, a) => ({ role: m.role, content: (i === 0 && m.role === 'user' ? SYSTEM + '\n\n' : '') + m.content }));
    if (msgs[0].role !== 'user') msgs.shift();
    const tools = [
      { name: 'dashboard_summary', description: 'Counts of new leads, quotes to approve, upcoming jobs, follow-ups due and content drafts. Returns an object.', execute: () => counts() },
      { name: 'list_leads', description: 'List leads with id, handle, keyword, stage, vehicle, service. Optional stage filter. Returns an array.', inputSchema: { type: 'object', properties: { stage: { type: 'string' } } }, execute: (i) => leadsArr().filter((l) => !i || !i.stage || l.stage === i.stage).slice(0, 40).map((l) => ({ id: l.id, handle: l.handle, keyword: l.keyword, stage: l.stage, vehicle: l.vehicle, service: l.service, sample: l.sample })) },
      { name: 'get_lead', description: 'Full record for one lead id including history. Returns an object.', inputSchema: { type: 'object', properties: { id: { type: 'string' } }, required: ['id'] }, execute: (i) => S.leads[i.id] || { error: 'No such lead' } },
      { name: 'get_setup', description: 'Pricing rules, reply templates and links saved in Setup. Returns an object.', execute: () => ({ pricing: S.config.pricing, templates: S.config.templates, links: S.config.links, business: S.config.business, openQuestions: openQuestions() }) },
    ];
    try {
      await sample(msgs, { tools, cache: false, onText: (u) => { bot.content = u.text; renderMsgs(); } });
    } catch (e) { bot.content = bot.content || (e && e.code === 'not_granted' ? 'Claude access was declined for this page.' : 'Claude could not answer right now (' + ((e && (e.code || e.message)) || 'error') + '). Try again in a moment.'); }
    S.busy = false; renderMsgs();
  }

  /* ---------- lead drawer ---------- */
  function renderDrawer() {
    let bg = $('#drawer');
    if (!S.open || !S.leads[S.open]) { if (bg) bg.remove(); return; }
    const a = document.activeElement; if (bg && a && bg.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    const l = S.leads[S.open];
    if (!bg) { bg = document.createElement('div'); bg.id = 'drawer'; bg.className = 'drawer-bg'; document.body.appendChild(bg); }
    const sizeOpt = (v) => '<option value="' + v + '" ' + (l.vehicleClass === v ? 'selected' : '') + '>' + (v ? (v === 'suv' ? 'SUV' : v[0].toUpperCase() + v.slice(1)) : 'Not set') + '</option>';
    bg.innerHTML = '<aside class="drawer" role="dialog" aria-label="Lead record"><div class="row between"><div class="t row"><h2>@' + esc(l.handle) + '</h2>' + srcPill(l) + stagePill(l) + sampleBadge(l) + '</div><button class="btn ghost" data-act="close" aria-label="Close">✕</button></div>' +
      '<div class="muted">Captured ' + when(l.createdAt) + ' from ' + esc(l.platform) + (l.postId ? ' · ' + esc(l.postId) : '') + (l.repeatCount ? ' · ' + l.repeatCount + ' repeat event(s) merged' : '') + '</div>' +
      '<form id="detailform" class="card"><div class="grid2">' + ['name:Name', 'vehicle:Vehicle', 'service:Service', 'photos:Photos link'].map((x) => { const [k, lab] = x.split(':'); return '<div class="fld"><label for="d-' + k + '">' + lab + '</label><input id="d-' + k + '" value="' + esc(l[k]) + '"></div>'; }).join('') + '<div class="fld"><label for="d-vehicleClass">Vehicle size</label><select id="d-vehicleClass">' + ['', 'sedan', 'suv', 'truck'].map(sizeOpt).join('') + '</select></div></div><div class="fld"><label for="d-notes">Notes</label><textarea id="d-notes">' + esc(l.notes) + '</textarea></div><div class="row"><button class="btn go" type="submit">Save details</button></div></form>' +
      (l.quote ? '<div class="card"><div class="t"><b>Quote</b><span class="badge ' + (l.quote.status === 'approved' ? 'ok' : 'warn') + '">' + esc(l.quote.status.replace('_', ' ')) + '</span>' + (l.quote.amount ? '<b>' + money(l.quote.amount) + '</b>' : '') + '</div>' + (l.quote.reason ? '<div class="muted">' + esc(l.quote.reason) + '</div>' : '') + '</div>' : '') +
      (l.reply ? '<div class="card"><b>Reply draft</b><div class="copybox">' + esc(l.reply.text) + '</div><div class="row"><button class="btn" data-act="copy" data-id="' + esc(l.id) + '">Copy reply</button></div></div>' : '') +
      '<div class="row">' + (l.stage === 'ready_to_quote' && !l.quote ? '<button class="btn go" data-act="draftq" data-id="' + esc(l.id) + '">Draft quote</button>' : '') + (l.stage === 'closed' ? '' : '<button class="btn ghost" data-act="closelead" data-id="' + esc(l.id) + '">Close lead</button>') + '</div>' +
      '<div><div class="eyebrow">History</div><ul class="tl">' + l.history.slice().reverse().map((h) => '<li><div><b>' + esc(h.action) + '</b><div class="who">' + esc(h.agent) + ' · ' + when(h.at) + '</div>' + (h.detail ? '<div class="muted">' + esc(h.detail) + '</div>' : '') + '</div></li>').join('') + '</ul></div></aside>';
  }

  /* ---------- actions ---------- */
  const val = (id) => { const e = document.getElementById(id); return e ? e.value : ''; };
  async function act(el) {
    const a = el.dataset.act; const id = el.dataset.id; const l = id ? S.leads[id] : null;
    try {
      if (a === 'open') { const x = clone(S.leads[id]); if (x.isNew) { x.isNew = false; await saveLead(x); } S.open = id; renderDrawer(); }
      else if (a === 'close') { S.open = null; renderDrawer(); }
      else if (a === 'filter') { S.filter = el.dataset.v; refresh(true); }
      else if (a === 'import') {
        const rows = P.parseTable(val('paste')); if (!rows.length) return toast('Paste the header row and at least one data row.');
        const r = P.importRows(S.leads, 'instagram', rows); await saveLeads(r.leads);
        r.ignored.forEach((x) => S.errors.unshift({ at: new Date().toISOString(), agent: 'intake', text: 'Row ' + x.row + ' ignored: ' + x.reason }));
        toast(r.created + ' new, ' + r.merged + ' merged, ' + r.duplicates + ' repeats skipped, ' + r.ignored.length + ' ignored'); refresh(true);
      }
      else if (a === 'sample') { const r = P.importRows(S.leads, 'instagram', P.sampleRows(), undefined, { sample: true }); await saveLeads(r.leads); r.ignored.forEach((x) => S.errors.unshift({ at: new Date().toISOString(), agent: 'intake', text: 'Sample row ' + x.row + ' ignored: ' + x.reason })); toast('Sample data loaded. Every sample lead is labeled.'); refresh(true); }
      else if (a === 'clear-sample') { await removeLeads(Object.values(S.leads).filter((x) => x.sample).map((x) => x.id)); toast('Sample leads removed'); }
      else if (a === 'draftq') { await saveLead(P.draftQuote(l, S.config)); toast(S.leads[id].quote.status === 'drafted' ? 'Quote drafted for your approval' : 'Sent to you for pricing'); }
      else if (a === 'approveq') { const n = val('amt-' + id); await saveLead(P.approveQuote(l, n, S.config)); toast('Quote approved'); }
      else if (a === 'copy') copy(l.reply.text);
      else if (a === 'copytext') copy(el.dataset.v);
      else if (a === 'sent') await saveLead(P.markReplySent(l));
      else if (a === 'prep') { const cs = document.getElementById('cs-' + id); await saveLead(P.prepareBooking(l, S.config, { customSlot: !!(cs && cs.checked) })); }
      else if (a === 'confirm') { await saveLead(P.confirmBooked(l, val('slot-' + id))); toast('Marked booked'); }
      else if (a === 'closelead') { const x = clone(l); x.stage = 'closed'; x.stageAt = new Date().toISOString(); x.history.push({ at: x.stageAt, agent: 'Owner', action: 'Lead closed', detail: '' }); await saveLead(x); }
      else if (a === 'addprice') { S.config.pricing.push({ service: '', sedan: '', suv: '', truck: '' }); renderPage('setup'); }
      else if (a === 'delprice') { readPricing(); S.config.pricing.splice(Number(el.dataset.i), 1); renderPage('setup'); }
      else if (a === 'draftc') await draftContent();
      else if (a === 'approvec' || a === 'savec') { const c = clone(S.content[id]); c.hook = val('h-' + id); c.caption = val('c-' + id); if (a === 'approvec') c.status = 'approved'; await saveContent(c); toast(a === 'approvec' ? 'Approved. Copy it into Buffer or Instagram when you are ready.' : 'Saved'); }
      else if (a === 'copyc') copy(val('h-' + id) + '\n\n' + val('c-' + id));
      else if (a === 'delc') await removeContent(id);
      else if (a === 'suggest') { const i = $('#chatin'); if (i) i.value = el.dataset.v; sendChat(el.dataset.v); if (i) i.value = ''; }
      else if (a === 'usetpl') { S.config.templates[el.dataset.k] = S.chat[Number(el.dataset.i)].content; S.config.templatesAreSample = false; await saveConfig(); toast('Saved as your ' + el.dataset.k + ' template'); }
    } catch (e) { fail(e.message || String(e), l ? (a === 'prep' || a === 'confirm' ? 'booking' : 'quote') : 'system'); }
  }
  function readPricing() {
    S.config.pricing = [...document.querySelectorAll('[data-prow]')].map((row) => { const o = {}; row.querySelectorAll('[data-pf]').forEach((i) => { o[i.dataset.pf] = i.dataset.pf === 'service' ? i.value.trim() : (i.value === '' ? '' : Number(i.value)); }); return o; });
  }
  async function draftContent() {
    const notes = val('notes').trim(); const cta = val('cta') || 'PRICE';
    if (!notes) return toast('Add a few footage notes first.');
    let d = null;
    if (sample) {
      S.busy = true; renderPage('content');
      try { d = await sample.json('You write short-form Instagram Reel copy for Pure Sport Detailing, a car detailing business. From these footage notes, write one scroll-stopping hook (under 12 words), one caption (under 60 words, plain, no hashtags spam, no emojis) and end the caption with a call to action telling people to comment ' + cta + '. Do not invent prices, results or guarantees not in the notes. Reply as JSON: {"hook": string, "caption": string}.\n\nNotes:\n' + notes, { cache: false }); } catch (e) { fail('Claude draft failed (' + ((e && (e.code || e.message)) || 'error') + '). Used a simple template instead.', 'content'); }
      S.busy = false;
    }
    if (!d || !d.hook) d = P.fallbackContent(notes, cta);
    const c = { id: 'c' + Date.now().toString(36), hook: d.hook, caption: d.caption, cta, status: 'draft', at: new Date().toISOString(), notes };
    await saveContent(c); renderPage('content');
  }

  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (el && !(el.tagName === 'TR' && e.target.closest('a,button'))) { act(el); return; }
    const m = e.target.closest('[data-menu]'); if (m) { toggleMenu(); return; }
    const bg = e.target.closest('.drawer-bg'); if (bg && e.target === bg) { S.open = null; renderDrawer(); }
    if (e.target.closest('.menu a')) toggleMenu(false);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('.menu')) toggleMenu(false); else if (S.open) { S.open = null; renderDrawer(); } } });
  document.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (e.target.id === 'chatform') { const i = $('#chatin'); const t = i.value; i.value = ''; sendChat(t); }
    else if (e.target.id === 'detailform') { const l = S.leads[S.open]; const patch = {}; ['name', 'vehicle', 'service', 'photos', 'notes', 'vehicleClass'].forEach((k) => { patch[k] = val('d-' + k); }); await saveLead(P.updateDetails(l, patch)); toast('Details saved'); }
    else if (e.target.id === 'setupform') {
      readPricing(); const c = S.config;
      c.business = { name: val('b-name'), area: val('b-area'), hours: val('b-hours') }; c.instagram = { handle: val('i-handle'), testReel: val('i-reel') };
      c.links = { booking: val('l-book').trim(), form: val('l-form').trim(), sheet: val('l-sheet').trim(), review: val('l-review').trim() };
      const t = { PRICE: val('t-PRICE'), BOOK: val('t-BOOK'), FOLLOWUP: val('t-FOLLOWUP'), REVIEW: val('t-REVIEW') };
      if (JSON.stringify(t) !== JSON.stringify(P.DEFAULT_TEMPLATES)) c.templatesAreSample = false;
      c.templates = t; c.followupDays = Number(val('f-days')) || 3; await saveConfig();
    }
  });
  document.addEventListener('change', (e) => { const k = e.target.dataset && e.target.dataset.conn; if (k) { S.config.connections[k] = e.target.checked; saveConfig(); } });

  function toggleMenu(force) {
    const open = $('.menu'); if (open && force !== true) { open.remove(); return; } if (open) return;
    const m = document.createElement('div'); m.className = 'menu';
    m.innerHTML = '<nav aria-label="Pages">' + PAGES.map((p) => '<a href="#' + p[0] + '">' + esc(p[1]) + '<small>' + esc(p[2]) + '</small></a>').join('') + '</nav>';
    m.addEventListener('click', (e) => { if (e.target === m) m.remove(); });
    document.body.appendChild(m);
  }

  boot();
})();

</script>
